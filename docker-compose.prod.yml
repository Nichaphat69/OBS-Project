# Production stack — แยกไฟล์จาก docker-compose.yml (ของเครื่องทดสอบ) โดยตั้งใจ ไม่ใช่ overlay
# เพราะความต่างไม่ได้มีแค่ค่าไม่กี่ตัว แต่เป็นคนละรูปแบบการเปิดพอร์ต: เครื่องทดสอบเปิด 3000/4301/5433
# ออกมาที่ host ตรงๆ ส่วนตัวนี้ไม่เปิดอะไรออก host เลยนอกจาก 80/443 ของ reverse proxy
#
#   มี reverse proxy เป็นของตัวเอง (ขอใบรับรอง TLS เองด้วย Caddy):
#     docker compose -f docker-compose.prod.yml --env-file .env.production --profile edge up -d
#   เครื่องที่มี nginx/reverse proxy ของระบบอื่นถือ 80/443 อยู่แล้ว (เช่นเครื่องที่รัน iNexus):
#     docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#     แล้วให้ proxy ตัวนั้นชี้มาที่ 127.0.0.1:${WEB_PORT} (หน้าเว็บ) และ 127.0.0.1:${API_PORT} (API)
#
# ⚠️ ก่อนใช้จริงต้องไล่ .env.production ให้ครบทุกบรรทัดก่อน — ทุกค่าที่ยังชี้ไป test/sandbox จะทำให้
# ระบบทำงาน "ได้" แต่ผิดเงียบๆ (บอสระบุข้อนี้เป็นเงื่อนไขห้ามพลาดของ go-live) ดู .env.production.example
#
# สิ่งที่ยังไม่ได้ทำในไฟล์นี้ และต้องตัดสินใจก่อน go live จริง:
#   - ยังไม่มีการส่ง backup ออกนอกเครื่อง (pg-backup เขียนลง volume บนเครื่องเดียวกัน — เครื่องพังก็หายด้วย)
#   - ยังไม่ได้แยก PostgreSQL ออกเป็น managed service
#   - ยังไม่มี monitoring/alert นอกจาก Sentry

name: obs-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?ต้องตั้งค่า}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ต้องตั้งค่า}
      POSTGRES_DB: ${POSTGRES_DB:?ต้องตั้งค่า}
    # ไม่เปิดพอร์ตออก host โดยตั้งใจ — ต่างจากเครื่องทดสอบที่เปิด 5433 ไว้ให้เครื่องมือฝั่ง dev ต่อตรง
    # ฐานข้อมูล production ต้องเข้าถึงได้จากเครือข่ายภายในของ compose เท่านั้น
    volumes:
      - obs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    env_file: .env.production
    environment:
      # ต่อผ่านชื่อ service ในเครือข่าย Docker — คนละค่ากับ DATABASE_URL ใน .env ที่ไว้ให้เครื่องมือฝั่ง host
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PORT: 4301
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    # ผูกกับ 127.0.0.1 เท่านั้น — ให้ reverse proxy บนเครื่องเดียวกันต่อได้ แต่เน็ตภายนอกเข้าไม่ถึง
    # ใช้ตอนเครื่องมี nginx ของระบบอื่นถือ 80/443 อยู่แล้ว (ดูหมายเหตุหัวไฟล์)
    ports:
      - '127.0.0.1:${API_PORT:-4301}:4301'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:4301/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Next.js ฝัง NEXT_PUBLIC_* เข้า bundle ตอน build — เปลี่ยนค่านี้แล้วต้อง build ใหม่ แค่ up -d ไม่พอ
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    restart: always
    environment:
      API_BASE_URL: http://api:4301
      PORT: 3000
      NODE_ENV: production
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  # TLS + ทางเข้าเดียวของระบบ — Caddy ขอและต่ออายุใบรับรองให้เองจาก Let's Encrypt
  # ต้องชี้ DNS ของ ${PUBLIC_DOMAIN} และ ${API_DOMAIN} มาที่เครื่องนี้ก่อน ไม่งั้นขอใบรับรองไม่ผ่าน
  # อยู่ใต้ profile `edge` — สตาร์ทเฉพาะเครื่องที่ยังไม่มี reverse proxy เป็นของตัวเอง
  #   มี proxy เอง:        docker compose -f docker-compose.prod.yml --profile edge up -d
  #   อยู่หลัง nginx คนอื่น: docker compose -f docker-compose.prod.yml up -d   (ไม่ใส่ profile)
  # กรณีหลัง ตัว reverse proxy ของเครื่องต้อง proxy ไปที่ 127.0.0.1:${WEB_PORT} และ 127.0.0.1:${API_PORT}
  proxy:
    profiles: ['edge']
    image: caddy:2-alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?ต้องตั้งค่าโดเมนจริง}
      API_DOMAIN: ${API_DOMAIN:?ต้องตั้งค่าโดเมนของ API}
      TLS_EMAIL: ${TLS_EMAIL:?ต้องตั้งอีเมลสำหรับแจ้งเตือนใบรับรองหมดอายุ}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - obs_caddy_data:/data
      - obs_caddy_config:/config
    depends_on:
      - web
      - api
    logging: *logging

  # สำรองฐานข้อมูลวันละครั้ง เก็บย้อนหลังตาม BACKUP_KEEP_DAYS
  # ⚠️ เขียนลง volume บนเครื่องเดียวกับฐานข้อมูล — กันได้แค่ "ลบข้อมูลผิด/อัปเกรดพัง" ไม่ได้กันเครื่องหาย
  # ต้องมีตัวส่งไฟล์ออกนอกเครื่อง (S3 หรืออื่นๆ) อีกชั้นก่อนถือว่าปลอดภัยจริง
  pg-backup:
    image: postgres:16-alpine
    restart: always
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - obs_pgbackup:/backup
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          f="/backup/obs-$$(date +%Y%m%d-%H%M%S).sql.gz"
          if pg_dump --no-owner | gzip > "$$f"; then
            echo "[pg-backup] $$f ($$(du -h "$$f" | cut -f1))"
          else
            echo "[pg-backup] ล้มเหลว $$(date -Iseconds)" >&2
            rm -f "$$f"
          fi
          find /backup -name 'obs-*.sql.gz' -mtime "+$$BACKUP_KEEP_DAYS" -delete
          sleep 86400
        done
    logging: *logging

  # n8n สำหรับงานอัตโนมัติของ OBS — ตั้งใจแยกตัวจาก n8n บนเครื่อง dev ซึ่งมี workflow ของโปรเจกต์ BSCP
  # ที่เปิดทำงานอยู่ปนอยู่ด้วย ยกมาทั้งตัวจะลาก automation ของทีมอื่นมาด้วย (ตรวจพบ 28 ก.ย. 69)
  #
  # อยู่ในเครือข่าย compose เดียวกับ api จึงเรียก http://api:4301 ได้ตรงๆ — ไม่ต้องพึ่ง Cloudflare Tunnel
  # ที่ URL เปลี่ยนทุกครั้งที่รีสตาร์ท เหลือแค่ LINE webhook เท่านั้นที่ยังต้องใช้ tunnel
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.40.7
    restart: always
    environment:
      # โซนเวลาไทย — workflow มี trigger 09:00 ถ้าไม่ตั้ง n8n ใช้ UTC แล้วจะยิงตอน 16:00 เวลาไทย
      GENERIC_TIMEZONE: ${TZ:-Asia/Bangkok}
      TZ: ${TZ:-Asia/Bangkok}
      # ตั้งเองเสมอ — ถ้าปล่อยให้ n8n สุ่มเก็บไว้ใน volume แล้ววันหนึ่ง volume หาย credential ทั้งหมด
      # จะถอดรหัสไม่ได้อีกเลย
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?ต้องตั้งค่า}
      N8N_PORT: 5678
      N8N_SECURE_COOKIE: 'false'
      N8N_RUNNERS_ENABLED: 'true'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
    ports:
      - '127.0.0.1:${N8N_PORT:-5678}:5678'
    volumes:
      - obs_n8n:/home/node/.n8n
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  # ที่เก็บไฟล์ PDF — ย้ายออกจากฐานข้อมูล (ตัดสินใจ 28 ก.ย. 69) เดิมเก็บเป็น bytea ในตาราง ทำให้
  # ไฟล์สำรองรายวันลากไฟล์ทุกใบไปด้วยและโตขึ้นเรื่อยๆ ตามการใช้งาน
  #
  # ใช้ Garage ไม่ใช่ MinIO เพราะ MinIO ปิด image สาธารณะไปแล้ว (ตรวจเมื่อ 28 ก.ย. 69 — ทั้ง Docker Hub
  # และ quay.io ปฏิเสธ) Garage พูดภาษา S3 เหมือนกันและ image เล็กกว่ามาก (21 MB เทียบกับ SeaweedFS
  # 532 MB / Zenko 1.46 GB) ซึ่งสำคัญเพราะเครื่องนี้ RAM 1.9 GB และแชร์กับระบบอื่น
  # วันหนึ่งย้ายไป S3 จริงของ AWS ได้โดยเปลี่ยนแค่ endpoint กับ key
  #
  # ไม่เปิดพอร์ตออกเครื่อง — api เรียกที่ http://storage:3900 ในเครือข่าย Docker เท่านั้น
  storage:
    image: dxflrs/garage:v1.0.1
    restart: always
    environment:
      # ส่งเป็น env ไม่เขียนลง garage.toml เพราะ Garage ปฏิเสธไฟล์ config ที่คนอื่นอ่านได้
      GARAGE_RPC_SECRET: ${STORAGE_RPC_SECRET:?ต้องตั้งค่า — สร้างด้วย openssl rand -hex 32}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - obs_storage_meta:/var/lib/garage/meta
      - obs_storage_data:/var/lib/garage/data
    logging: *logging

volumes:
  obs_storage_meta:
  obs_storage_data:
  obs_n8n:
  obs_pgdata:
  obs_pgbackup:
  obs_caddy_data:
  obs_caddy_config:
