<!-- ══ หน้า login — คลุมทับทุกอย่างจนกว่าจะยืนยันตัวได้ ══
     สองคอลัมน์: ซ้ายเป็นภาพประกอบแบรนด์ (ตกแต่งล้วนๆ aria-hidden ใช้รูปจริง /img/login-orb.png)
     ขวาเป็นฟอร์มจริง — ไอดีของฟอร์ม/ช่องกรอกเดิมทั้งหมดยังอยู่ครบ จาวาสคริปต์ที่ล็อกอินไม่ต้องแก้อะไรเลย ══ -->
<div class="login-screen" id="loginScreen" hidden>
  <div class="login-art" aria-hidden="true"></div>
  <div class="login-panel">
    <form class="login-card" id="loginForm">
      <h1>เข้าสู่ระบบ OBS</h1>
      <p class="lc-sub">ระบบวางบิล Outsource — ใช้ชื่อผู้ใช้/รหัสผ่านที่แอดมินสร้างให้</p>
      <label>Username<input id="loginUser" type="text" autocomplete="username" required></label>
      <label>รหัสผ่าน<input id="loginPass" type="password" autocomplete="current-password" required></label>
      <div class="lc-err" id="loginErr" hidden></div>
      <button class="btn pri" type="submit" id="loginBtn">เข้าสู่ระบบ</button>
    </form>
  </div>
</div>

<!-- ══ แถบบน — เต็มความกว้าง โลโก้อยู่ซ้ายสุด กว้างคงที่ไม่ย่อตามเมนูข้าง ══ -->
<header class="topbar">
  <div class="brand">
    <img class="blogo" src="/img/logo.png" alt="iPassion OBS">
  </div>
  <div class="gap"></div>
  <!-- ตัวเลือกบริษัท/ลูกค้าที่ "กำลังดำเนินการอยู่" — เปลี่ยนแล้วข้อมูลทั้งระบบ
       (แดชบอร์ด/ตรวจ Manday/วางบิล/ใบแจ้งหนี้) จะกรองเหลือแค่สัญญานี้ทันที
       ซ่อนไว้ก่อนจนกว่า startApp() จะดึงรายชื่อบริษัทมาใส่ให้ (กันแวบเห็นช่องเปล่า)
       เดิมเป็น <select> ธรรมดา — รายการที่กางออกมาเป็นเมนูของเบราว์เซอร์เอง แต่งหน้าตาไม่ได้เลย
       เปลี่ยนเป็นปุ่ม + แผงลอยแบบเดียวกับเมนูบัญชี (.whopop) ให้กดแล้วสวยเข้าธีมเดียวกันทั้งแอป -->
  <div class="ctxwrap" id="contractSwitchWrap" hidden>
    <button class="ctxbtn" id="contractSwitchBtn" type="button"
            aria-haspopup="listbox" aria-expanded="false" aria-controls="contractSwitchPop">
      <svg class="i sm"><use href="#i-cog"/></svg>
      <span class="ctx-label" id="contractSwitchLabel">…</span>
      <svg class="i sm cv"><use href="#i-cd"/></svg>
    </button>
    <div class="ctxpop" id="contractSwitchPop" role="listbox"
         aria-label="เลือกบริษัท/สัญญาที่กำลังดำเนินการอยู่" hidden></div>
  </div>
  <span class="env dry" id="envChip"><span class="sw"></span> …</span>
  <span class="mast-date" id="mastDate"></span>
  <div class="bellwrap">
    <button class="bell" id="bellBtn" title="การแจ้งเตือน" aria-label="การแจ้งเตือน"
            aria-expanded="false" aria-controls="bellPop">
      <svg class="i"><use href="#i-bell"/></svg>
      <span class="dot" id="bellCount" hidden>0</span>
    </button>
    <div class="bellpop" id="bellPop" role="dialog" aria-label="อะไรเพิ่งเกิดขึ้น" hidden></div>
  </div>
  <div class="who">
    <button class="whobtn" id="whoBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="whoPop">
      <span class="av" id="actorAvatar">?</span>
      <span class="wt"><b id="actorName">…</b><span id="actorRole">กำลังโหลด</span></span>
      <svg class="i sm cv"><use href="#i-cd"/></svg>
    </button>
    <div class="whopop" id="whoPop" role="menu" aria-label="บัญชีผู้ใช้" hidden>
      <div class="wp-hd"><b id="actorUser">…</b><span id="actorRole2">…</span></div>
      <button class="wp-item" id="logoutBtn" role="menuitem">
        <svg class="i sm"><use href="#i-cl"/></svg> ออกจากระบบ
      </button>
    </div>
  </div>
</header>

<div class="shell">

  <!-- ══ เมนูข้าง ══ -->
  <aside class="side">
    <!-- data-step ใช้แทนเลขที่เคยเป็นวงกลม — ตอนหุบเมนูเหลือแต่ไอคอน
         ลำดับขั้นจึงอ่านจากเลขมุมไอคอนกับ tooltip แทน -->
    <nav class="snav" id="tabbar" aria-label="เมนูหลัก">
      <button class="mtab on" data-view="dash" title="แดชบอร์ด">
        <svg class="i"><use href="#i-grid"/></svg> <span>แดชบอร์ด</span></button>

      <span class="sgrp">ขั้นตอนการทำงาน</span>
      <button class="mtab" data-view="upload" data-step="1" title="ขั้น 1 · อัปโหลด Timesheet">
        <svg class="i"><use href="#i-envelope-plus"/></svg> <span>อัปโหลด Timesheet</span></button>
      <button class="mtab" data-view="queue" data-step="2" title="ขั้น 2 · ตรวจ Manday">
        <svg class="i"><use href="#i-list-chk"/></svg> <span>ตรวจ Manday</span>
        <span class="bdg" id="queueBadge">–</span></button>
      <button class="mtab" data-view="cycles" data-step="3" title="ขั้น 3 · วางบิล และร่างอีเมล">
        <svg class="i"><use href="#i-invoice"/></svg> <span>วางบิล &amp; ร่างอีเมล</span>
        <span class="bdg" id="cycleBadge">–</span></button>

      <span class="sgrp">อ้างอิง</span>
      <button class="mtab" data-view="invoices" title="ใบแจ้งหนี้">
        <svg class="i"><use href="#i-doc"/></svg> <span>ใบแจ้งหนี้</span></button>
      <button class="mtab" data-view="master" title="ข้อมูลหลัก" id="masterNavBtn" hidden>
        <svg class="i"><use href="#i-users"/></svg> <span>ข้อมูลหลัก</span></button>
      <button class="mtab" data-view="sysadmin" title="จัดการระบบ" id="sysAdminTab" hidden>
        <svg class="i"><use href="#i-cog"/></svg> <span>จัดการระบบ</span></button>
    </nav>

    <button class="sidetoggle" id="sideToggle" title="ย่อเมนู" aria-label="ย่อเมนู" aria-pressed="false">
      <svg class="i"><use href="#i-panel"/></svg> <span>ย่อเมนู</span>
    </button>
  </aside>

  <!-- ══ เนื้อหา ══ -->
  <div class="frame">
    <main id="main">
      <div class="loading">กำลังโหลดข้อมูล…</div>
    </main>
  </div>

</div>

<div id="tst" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>
<script src="/app.js?v=__BUILD__" type="module"></script>
</body>
</html>
